# The whole app on one machine, from the Dockerfile, with stand-ins for the outside services:
#   SQL Server   the database (or PostgreSQL: see docker-compose.postgres.yml)
#   Mailpit      catches every email; read them at http://localhost:8025
#   receipts and backups go to two Docker volumes (the FileSystem store)
#
#   docker compose up --build
#   then open http://localhost:8080 -- admin sign-in is the fake local one (/dev/signin), and
#   guardian sign-in codes arrive in Mailpit.
#
# FOR TRYING THE APP OUT ONLY. It runs in the Development environment so the fake admin sign-in
# works, and the passwords below are placeholders. A real deployment uses Production, real
# Microsoft/Google sign-in, real secrets, and an S3 bucket or Azure storage for files -- see
# infra/HOSTING.md. Override any value with a .env file beside this one (see .env.example).

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DevAuth__Enabled: "true"
      DevAuth__SeedSampleData: "true"   # a small sample troop, loaded into an empty database
      # Behind GitHub Codespaces' proxy: use the address the browser used (X-Forwarded-Host), not
      # localhost:8080, for redirects. Development only; see Program.cs.
      ForwardedHeaders__TrustHost: "true"
      ConnectionStrings__FinanceDb: "Server=sqlserver;Database=BsaTroopFinances;User Id=sa;Password=${SQL_SA_PASSWORD:-Local-Only-Pa55word!};TrustServerCertificate=True"
      Storage__Provider: FileSystem
      Storage__FileSystem__Root: /data/files
      BackupStorage__Provider: FileSystem
      BackupStorage__FileSystem__Root: /data/backups
      Email__Provider: Smtp
      Email__SenderAddress: noreply@example.com
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Email__Smtp__Security: None
      Auth__LoginCodePepper: ${LOGIN_CODE_PEPPER:-local-only-pepper-not-for-real-use}
      # Backups start from outside, as on a host that sleeps when idle. Try it with:
      #   curl -X POST -H "Authorization: Bearer local-only-backup-trigger-key-0123456789" http://localhost:8080/internal/backup
      Backup__Schedule: External
      Backup__TriggerKey: ${BACKUP_TRIGGER_KEY:-local-only-backup-trigger-key-0123456789}
    volumes:
      - files:/data/files
      - backups:/data/backups
    depends_on:
      sqlserver:
        condition: service_healthy
      files-owner:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # New volumes belong to root; the app runs as the image's non-root user (uid 1654).
  files-owner:
    image: busybox:1.36
    command: chown -R 1654:1654 /data/files /data/backups
    volumes:
      - files:/data/files
      - backups:/data/backups

  sqlserver:
    # SQL Server has no ARM build: on an Apple-silicon Mac this runs under emulation (slowly).
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-Local-Only-Pa55word!}
      MSSQL_PID: Express
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # Mailpit's inbox

volumes:
  sqldata:
  files:
  backups:
