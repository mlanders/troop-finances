# Fly.io setup (infra/SETUP.md "Fly.io"): the app from the Dockerfile, stopped when nobody is using
# it, with receipts and backups on a 1 GB volume. The database is a PostgreSQL elsewhere (Neon's free
# plan suits a sleeping app). Secrets are set with `fly secrets set`, never in this file.
#
#   fly launch --copy-config --no-deploy --name <your-app-name>
#   fly secrets set ...            (see infra/SETUP.md)
#   fly deploy
#
# About $2-6/month: the app is billed only while running, the volume about $0.15/GB.

app = "troop-finances"           # fly launch --name replaces this with yours
primary_region = "sea"           # nearest to your troop: fly platform regions

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  Database__Provider = "Postgres"
  Storage__Provider = "FileSystem"
  Storage__FileSystem__Root = "/app/data/files"
  # Same volume as the receipts: enough to undo a mistake, not a copy kept somewhere else.
  # infra/HOSTING.md "Backups" says how to send them to a separate bucket instead.
  BackupStorage__Provider = "FileSystem"
  BackupStorage__FileSystem__Root = "/app/data/backups"
  # The app is stopped when idle, so the nightly backup is started from outside: the GitHub
  # Actions workflow .github/workflows/nightly-backup.yml (needs Backup__TriggerKey as a secret).
  Backup__Schedule = "External"
  Email__Provider = "Smtp"
  Email__Smtp__Port = "587"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# Fly gives the volume to the image's own (non-root) user, so the app can write to it.
[[mounts]]
  source = "troop_data"
  destination = "/app/data"
  initial_size = "1gb"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
